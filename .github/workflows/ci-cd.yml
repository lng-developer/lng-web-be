name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/lng_web_be_test
      REDIS_ENABLED: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src -name "*.js" -print0 | xargs -0 -n1 node -c

      - name: Architecture tests
        run: npm run test:architecture -- --runInBand

      - name: Auth tests
        run: npm run test:auth -- --runInBand

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    environment: production

    steps:
      - name: Deploy with PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin develop
            git reset --hard origin/develop

            npm ci --omit=dev

            if pm2 describe "${{ secrets.PM2_APP_NAME }}" > /dev/null; then
              pm2 reload "${{ secrets.PM2_APP_NAME }}" --update-env
            else
              pm2 start src/server.js --name "${{ secrets.PM2_APP_NAME }}"
            fi

            pm2 save

name: Deploy Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-lng-web-be
  cancel-in-progress: true

jobs:
  test:
    name: Backend test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --silent

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show deploy info
        run: |
          echo "===== Runner Info ====="
          whoami
          pwd
          node -v
          npm -v

          echo "===== Commit Info ====="
          git log -1 --oneline

      - name: Install dependencies and build in workspace
        run: |
          npm install
          npm run build --if-present

      - name: Pull production folder
        working-directory: /home/lng/apps/lng-web-be
        run: |
          git fetch origin --prune
          git checkout develop
          git pull --ff-only origin develop
          git rev-parse HEAD > .release
          git log -1 --oneline > .release-info

      - name: Install production dependencies
        working-directory: /home/lng/apps/lng-web-be
        run: |
          npm install --omit=dev
          git checkout -- package-lock.json

      - name: Reload PM2
        working-directory: /home/lng/apps/lng-web-be
        run: |
          pm2 reload lng-web-be --update-env || pm2 restart lng-web-be --update-env
          pm2 save
          pm2 list
          health_port="$(grep -E '^PORT=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '[:space:]')"
          health_port="${health_port:-3000}"
          healthy=0
          for i in {1..60}; do
            curl -fsS "http://127.0.0.1:${health_port}/api/mapping/health" && break
            healthy=$i
            sleep 2
          done
          if [ "$healthy" = "60" ]; then
            pm2 logs lng-web-be --nostream --lines 120
          fi
          test "$healthy" != "60"
          cat .release-info

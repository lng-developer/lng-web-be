name: Deploy Backend

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-lng-web-be
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show deploy info
        run: |
          echo "===== Runner Info ====="
          whoami
          pwd
          node -v
          npm -v

          echo "===== Commit Info ====="
          git log -1 --oneline

      - name: Install dependencies and build in workspace
        run: |
          npm ci
          npm run build --if-present

      - name: Pull production folder
        working-directory: /home/lng/apps/lng-web-be
        run: |
          git fetch origin --prune
          git checkout develop
          git pull --ff-only origin develop
          git rev-parse HEAD > .release
          git log -1 --oneline > .release-info

      - name: Install production dependencies
        working-directory: /home/lng/apps/lng-web-be
        run: |
          npm ci --omit=dev

      - name: Reload PM2
        working-directory: /home/lng/apps/lng-web-be
        run: |
          pm2 reload lng-web-be --update-env || pm2 restart lng-web-be --update-env
          pm2 save
          pm2 list
          healthy=0
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/api/mapping/health && break
            healthy=$i
            sleep 2
          done
          test "$healthy" != "20"
          cat .release-info

name: Deploy Backend

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-lng-web-be
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show deploy info
        run: |
          echo "===== Runner Info ====="
          whoami
          pwd
          node -v
          npm -v

          echo "===== Commit Info ====="
          git log -1 --oneline

      - name: Install dependencies and build in workspace
        run: |
          npm install
          npm run build --if-present

      - name: Sync code to production folder
        run: |
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "logs" \
            --exclude "uploads" \
            ./ /home/lng/apps/lng-web-be/

      - name: Install production dependencies
        working-directory: /home/lng/apps/lng-web-be
        run: |
          npm install --omit=dev

      - name: Reload PM2
        working-directory: /home/lng/apps/lng-web-be
        run: |
          pm2 reload lng-web-be --update-env || pm2 restart lng-web-be --update-env
          pm2 save
          pm2 list
name: Deploy Backend

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lng-web-be-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-source:
    name: release-source
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the release source
        env:
          RELEASE_SOURCE: ${{ github.head_ref }}
        run: test "$RELEASE_SOURCE" = 'develop'

  core-test:
    name: Core test ${{ matrix.shard }}/2
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-vm-modules
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - name: Run core Jest shard
        shell: bash
        run: |
          mapfile -t all_tests < <(npx jest --listTests)
          core_tests=()
          for test_path in "${all_tests[@]}"; do
            [[ "$test_path" == *"hrCutoverTools.test.js" ]] && continue
            core_tests+=("$test_path")
          done

          selected_tests=()
          for index in "${!core_tests[@]}"; do
            (( index % 2 == ${{ matrix.shard }} )) && selected_tests+=("${core_tests[$index]}")
          done
          test "${#selected_tests[@]}" -gt 0
          npx jest --maxWorkers=2 --silent "${selected_tests[@]}"

  windows-powershell-test:
    name: Windows PowerShell test
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npx jest tests/hr/scripts/hrCutoverTools.test.js --runInBand --silent

  startup-smoke:
    name: Startup smoke
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test .github/scripts/verify-pr-ci.check.cjs
      - run: npm run smoke:startup

  package-pr:
    needs: [core-test, windows-powershell-test, startup-smoke]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-develop-${{ steps.source.outputs.tree }}
          path: source.tar
          retention-days: 14
          overwrite: true

  verify-pr-ci:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run-id: ${{ steps.verify.outputs.run-id }}
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: verify
        with:
          script: |
            const verify = require('./.github/scripts/verify-pr-ci.cjs');
            const result = await verify({ github, context,
              workflow: 'develop.yml', artifactPrefix: 'backend-develop',
              requiredJobs: ["Core test 0/2","Core test 1/2","Windows PowerShell test","Startup smoke","package-pr"] });
            core.setOutput('run-id', result.runId);
            core.setOutput('artifact-id', result.artifactId);
            core.info(`Using PR #${result.prNumber}, run ${result.runId}, tree ${result.tree}`);

  deploy-develop:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: verify-pr-ci
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    concurrency:
      group: lng-web-be-develop-server
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.verify-pr-ci.outputs.artifact-id }}
          run-id: ${{ needs.verify-pr-ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/be-develop-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11.6.2
      - name: Deploy isolated API-only develop release
        env:
          DEPLOY_SHA: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/be-develop-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          script=$(mktemp)
          trap 'rm -f "$script"' EXIT
          tar -xOf "$ARTIFACT_DIR/source.tar" tools/scripts/deploy/develop.sh > "$script"
          bash "$script" "$ARTIFACT_DIR/source.tar"

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          ECOMATRIX_SSH_PRIVATE_KEY: ${{ secrets.ECOMATRIX_SSH_PRIVATE_KEY }}
          ECOMATRIX_KNOWN_HOSTS: ${{ secrets.ECOMATRIX_KNOWN_HOSTS }}
        run: |
          test -n "$ECOMATRIX_SSH_PRIVATE_KEY"
          test -n "$ECOMATRIX_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECOMATRIX_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ECOMATRIX_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy tested revision and restart service
        env:
          ECOMATRIX_HOST: ${{ secrets.ECOMATRIX_HOST }}
          ECOMATRIX_USER: ${{ secrets.ECOMATRIX_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          test -n "$ECOMATRIX_HOST"
          test -n "$ECOMATRIX_USER"
          test -n "$DEPLOY_SHA"
          ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/lng-web-be
          export APP_ENV=production

          sudo -n /usr/bin/pm2 jlist | node -e '
            const { readFileSync } = require("node:fs");
            const apps = JSON.parse(readFileSync(0, "utf8"));
            const split = apps.some(({ name, pm2_env }) => {
              const role = pm2_env.env?.RUNTIME_ROLE ?? pm2_env.RUNTIME_ROLE;
              return name === "lng-web-be-worker"
                || name === "lng-web-be-scheduler"
                || (name === "lng-web-be" && role === "api");
            });
            if (split) {
              console.error("Split backend requires the coordinated deployment procedure.");
              process.exitCode = 1;
            }
          '

          previous_sha=$(git rev-parse HEAD)
          rollback() {
            status=$?
            if [ "$status" -ne 0 ]; then
              git checkout --detach --force "$previous_sha"
              npm ci --omit=dev
              sudo -n /usr/bin/pm2 startOrReload ecosystem.config.js --only lng-web-be --update-env
              sudo -n /usr/bin/pm2 save
            fi
            exit "$status"
          }
          trap rollback EXIT

          git fetch --depth=1 origin main
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git checkout --detach --force "$DEPLOY_SHA"
          git clean -ffd -e .env -e .env.production
          npm ci --omit=dev
          npm run smoke:startup
          npm run indexes:finance-import
          node src/modules/integration/listingImageSync/scripts/ensureListingImageSyncIndexes.js
          sudo -n /usr/bin/pm2 startOrReload ecosystem.config.js --only lng-web-be --update-env
          sudo -n /usr/bin/pm2 save
          restart_count=$(sudo -n /usr/bin/pm2 jlist | node -e 'let data = ""; process.stdin.on("data", (chunk) => { data += chunk; }); process.stdin.on("end", () => { const app = JSON.parse(data).find((item) => item.name === "lng-web-be"); if (!app) process.exit(1); process.stdout.write(String(app.pm2_env.restart_time)); });')
          for i in {1..15}; do
            curl -fsS http://127.0.0.1:3000/api/mapping/health >/dev/null && break
            test "$i" -lt 15
            sleep 2
          done
          for i in {1..15}; do
            curl -fsS http://127.0.0.1:3000/api/mapping/health >/dev/null
            sleep 2
          done
          stable_restart_count=$(sudo -n /usr/bin/pm2 jlist | node -e 'let data = ""; process.stdin.on("data", (chunk) => { data += chunk; }); process.stdin.on("end", () => { const app = JSON.parse(data).find((item) => item.name === "lng-web-be"); if (!app) process.exit(1); process.stdout.write(String(app.pm2_env.restart_time)); });')
          test "$restart_count" = "$stable_restart_count"
          trap - EXIT
          REMOTE


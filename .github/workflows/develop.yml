name: Deploy Backend

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-lng-web-be-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-test:
    name: Core test ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run core Jest shard
        shell: bash
        run: |
          mapfile -t all_tests < <(npx jest --listTests)
          core_tests=()
          for test_path in "${all_tests[@]}"; do
            [[ "$test_path" == *"hrCutoverTools.test.js" ]] && continue
            core_tests+=("$test_path")
          done

          selected_tests=()
          for index in "${!core_tests[@]}"; do
            (( index % 2 == ${{ matrix.shard }} )) && selected_tests+=("${core_tests[$index]}")
          done
          test "${#selected_tests[@]}" -gt 0
          npx jest --maxWorkers=2 --silent "${selected_tests[@]}"

  windows-powershell-test:
    name: Windows PowerShell test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx jest tests/hr/scripts/hrCutoverTools.test.js --runInBand --silent

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [core-test, windows-powershell-test]
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show deploy info
        run: |
          echo "===== Runner Info ====="
          whoami
          pwd
          node -v
          npm -v

          echo "===== Commit Info ====="
          git log -1 --oneline

      - name: Install dependencies and build in workspace
        run: |
          npm install
          npm run build --if-present

      - name: Pull production folder
        working-directory: /home/lng/apps/lng-web-be
        run: |
          git fetch origin --prune "${{ github.sha }}"
          git checkout --detach "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD > .release
          git log -1 --oneline > .release-info

      - name: Install production dependencies
        working-directory: /home/lng/apps/lng-web-be
        run: |
          npm ci --omit=dev

      - name: Create finance import indexes
        working-directory: /home/lng/apps/lng-web-be
        run: npm run indexes:finance-import

      - name: Create listing image sync indexes
        working-directory: /home/lng/apps/lng-web-be
        run: node src/modules/integration/listingImageSync/scripts/ensureListingImageSyncIndexes.js

      - name: Reload PM2 and verify health
        working-directory: /home/lng/apps/lng-web-be
        run: |
          pm2 reload lng-web-be --update-env || pm2 restart lng-web-be --update-env
          pm2 save
          pm2 list
          health_port="$(grep -E '^PORT=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '[:space:]')"
          health_port="${health_port:-3000}"
          healthy=0
          for i in {1..60}; do
            curl -fsS "http://127.0.0.1:${health_port}/api/mapping/health" && break
            healthy=$i
            sleep 2
          done
          if [ "$healthy" = "60" ]; then
            pm2 logs lng-web-be --nostream --lines 120
          fi
          test "$healthy" != "60"
          cat .release-info

name: Deploy Backend

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lng-web-be-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-test:
    name: Core test ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-vm-modules
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - name: Run core Jest shard
        shell: bash
        run: |
          mapfile -t all_tests < <(npx jest --listTests)
          core_tests=()
          for test_path in "${all_tests[@]}"; do
            [[ "$test_path" == *"hrCutoverTools.test.js" ]] && continue
            core_tests+=("$test_path")
          done

          selected_tests=()
          for index in "${!core_tests[@]}"; do
            (( index % 2 == ${{ matrix.shard }} )) && selected_tests+=("${core_tests[$index]}")
          done
          test "${#selected_tests[@]}" -gt 0
          npx jest --maxWorkers=2 --silent "${selected_tests[@]}"

  windows-powershell-test:
    name: Windows PowerShell test
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm i -g npm@11.6.2
      - run: npm ci
      - run: npx jest tests/hr/scripts/hrCutoverTools.test.js --runInBand --silent

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core-test, windows-powershell-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          ECOMATRIX_SSH_PRIVATE_KEY: ${{ secrets.ECOMATRIX_SSH_PRIVATE_KEY }}
          ECOMATRIX_KNOWN_HOSTS: ${{ secrets.ECOMATRIX_KNOWN_HOSTS }}
        run: |
          test -n "$ECOMATRIX_SSH_PRIVATE_KEY"
          test -n "$ECOMATRIX_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECOMATRIX_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ECOMATRIX_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy backend source and restart service
        env:
          ECOMATRIX_HOST: ${{ secrets.ECOMATRIX_HOST }}
          ECOMATRIX_USER: ${{ secrets.ECOMATRIX_USER }}
        run: |
          test -n "$ECOMATRIX_HOST"
          test -n "$ECOMATRIX_USER"
          git archive --format=tar HEAD | gzip | ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" 'tar -xzf - --no-same-owner --no-same-permissions --touch -C /srv/lng-web-be'
          ssh "$ECOMATRIX_USER@$ECOMATRIX_HOST" <<'REMOTE'
          set -euo pipefail
          cd /srv/lng-web-be
          npm ci --omit=dev
          npm run indexes:finance-import
          node src/modules/integration/listingImageSync/scripts/ensureListingImageSyncIndexes.js
          sudo -n /usr/bin/pm2 reload lng-web-be --update-env || sudo -n /usr/bin/pm2 restart lng-web-be --update-env
          sudo -n /usr/bin/pm2 save
          healthy=0
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/api/mapping/health >/dev/null && break
            healthy=$i
            sleep 2
          done
          test "$healthy" != "60"
          REMOTE


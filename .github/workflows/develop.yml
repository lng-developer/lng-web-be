name: Deploy Backend

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-lng-web-be
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted

    steps:
      - name: Deploy from GitHub
        run: |
          set -e

          cd /home/lng/apps/lng-web-be

          echo "===== Fetch latest code ====="
          git fetch origin develop
          git reset --hard origin/develop

          echo "===== Install dependencies ====="
          npm install

          echo "===== Build if exists ====="
          npm run build --if-present

          echo "===== Reload PM2 ====="
          pm2 reload lng-web-be --update-env || pm2 restart lng-web-be --update-env
          pm2 save
          pm2 list